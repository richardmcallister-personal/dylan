<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song · Bob Dylan</title>
<meta name="description" content="One Bob Dylan song through the years: recordings and every live performance on record.">
<link rel="preload" href="/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/d.css">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/assets/dylan-eye-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#b3261e">
<script>try{var t=localStorage.getItem("dn_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/d.js"></script>
</head>
<body>
<main id="main" class="wrap"><div class="loading">Loading…</div></main>
<script>
D.shell("songs");
(async () => {
  const M = document.getElementById("main");
  const slug = D.slug(D.qs("s") || "");
  const songs = await D.get("/data/songs.json");
  const s = songs.find((x) => x.s === slug);
  if (!s) {
    M.innerHTML = `<div class="head"><h1>Song not found</h1><p>No live performance of that song is on record. <a href="/songs/">Browse all songs</a>.</p></div>`;
    return;
  }
  document.title = `${s.n} · Bob Dylan`;
  const rank = songs.indexOf(s) + 1;
  const [perf, lives, albums] = await Promise.all([
    D.get(`/data/song/${slug}.json`),
    D.get("/data/lives/index.json").then((l) => (l.includes(slug) ? D.get(`/data/lives/${slug}.json`) : null)).catch(() => null),
    D.albums(),
  ]);
  const byS = Object.fromEntries(albums.map((a) => [a.s, a]));
  const years = Object.keys(s.y).map(Number);
  const peak = Object.entries(s.y).sort((a, b) => b[1] - a[1])[0];
  const thisYear = new Date().getFullYear();
  const spotify = `https://open.spotify.com/search/${encodeURIComponent("Bob Dylan " + s.n)}`;
  const lyrics = `https://www.bobdylan.com/?s=${encodeURIComponent(s.n)}`;

  let h = `<div class="head"><span class="tag">${s.c ? "Cover · " + D.esc(s.c) : "Song"}</span>
    <h1 style="margin-top:8px">${D.esc(s.n)}</h1>
    ${lives ? `<p>${D.esc(lives.intro)}</p>` : ""}
    <div class="btns"><a class="btn pri" href="${spotify}" target="_blank" rel="noopener">Find on Spotify</a>${s.c ? "" : `<a class="btn" href="${lyrics}" target="_blank" rel="noopener">Lyrics on bobdylan.com</a>`}</div></div>
    <div class="tiles" style="margin-bottom:16px">
      <div class="tile"><b class="num">${s.k}</b><span>times played live · #${rank} overall</span></div>
      <div class="tile"><b class="num">${s.f[0].slice(0, 4)}</b><span>first: <a href="/concert/?id=${s.f[1]}">${D.date(s.f[0])}</a></span></div>
      <div class="tile"><b class="num">${s.l[0].slice(0, 4)}</b><span>latest: <a href="/concert/?id=${s.l[1]}">${D.date(s.l[0])}</a></span></div>
      <div class="tile"><b class="num">${years.length}</b><span>different years · peak ${peak[0]} (${peak[1]})</span></div>
    </div>`;

  h += `<div id="listen"></div>`;
  // Stage history from the setlists: first show, comebacks after 4+ years away, latest show.
  const ps = perf.p.slice().sort((a, b) => (a[0] < b[0] ? -1 : 1));
  const yrs = (a, b) => (new Date(b) - new Date(a)) / 31557600000;
  const MISSING = (a, b) => (a < "1975" && b > "1974") || (a < "1988" && b > "1985");
  const stage = [];
  if (ps.length) stage.push({ d: ps[0][0], kind: "Live", title: "First performance on record", place: `${ps[0][2]}, ${ps[0][3]}`, id: ps[0][1], auto: 1 });
  for (let i = 1; i < ps.length; i++) {
    const gap = yrs(ps[i - 1][0], ps[i][0]);
    if (gap >= 4) stage.push({ d: ps[i][0], kind: "Revival", title: `Back after ${Math.floor(gap)} years`, place: `${ps[i][2]}, ${ps[i][3]}`, id: ps[i][1], auto: 1,
      note: `Not played since ${D.date(ps[i - 1][0])}.${MISSING(ps[i - 1][0], ps[i][0]) ? " The gap spans 1974 or 1986–87, which this site's setlists don't cover yet, so it may be shorter." : ""}` });
  }
  if (ps.length > 1) stage.push({ d: ps[ps.length - 1][0], kind: "Live", title: s.l[0] >= String(thisYear - 1) ? "Latest performance" : "Last performance on record", place: `${ps[ps.length - 1][2]}, ${ps[ps.length - 1][3]}`, id: ps[ps.length - 1][1], auto: 1 });
  const whenOf = (d) => d.length === 4 ? d : d.length === 7 ? D.date(d + "-01").replace(/^\S+ 1 |^1 /, "") : D.date(d);
  const lifeRow = (l) => {
    const a = l.a && byS[l.a];
    const links = [a ? `<a href="/album/?a=${a.s}">${D.esc(a.t)}</a>` : "", a ? D.spotify(a).replace('class="btn pri"', 'class="btn"') : "", l.id ? `<a href="/concert/?id=${l.id}">Setlist</a>` : ""].filter(Boolean);
    return `<li class="life k-${l.kind.toLowerCase()}">${a ? `<div class="thumb">${D.cover(a, 72)}</div>` : `<div class="dot"><i></i></div>`}<div>
      <div class="when"><span class="tag">${D.esc(l.kind)}</span>${l.change ? ` <span class="tag chg">${D.esc(l.change)}</span>` : ""} ${whenOf(l.d)} · ${D.esc(l.place)}</div>
      <h3>${D.esc(l.title)}</h3>${l.note ? `<p style="margin:2px 0 6px">${D.esc(l.note)}</p>` : ""}
      ${links.length ? `<div class="btns" style="margin-top:4px;align-items:center">${links.join(" ")}</div>` : ""}</div></li>`;
  };
  if (lives) {
    const ids = new Set(lives.lives.map((l) => l.id).filter(Boolean)), days = new Set(lives.lives.map((l) => l.d));
    const merged = lives.lives.concat(stage.filter((x) => !ids.has(x.id) && !days.has(x.d) && (x.kind === "Revival" || x === stage[stage.length - 1] || !lives.lives.some((l) => l.kind === "Live" && l.d <= x.d))))
      .sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
    h += `<section class="sheet"><span class="tag">Song genealogy</span><h2 style="margin-top:8px">From first take to latest revival</h2>
      <p class="small muted" style="margin:0 0 4px">Roots, recordings, rewrites and covers are written for this site; first shows, comebacks and the latest show come from the setlists.</p><ol class="lives">` +
      merged.map(lifeRow).join("") + `</ol>` +
      (lives.others && lives.others.length ? `<h3 style="margin-top:16px">Others who made it their own</h3><ul class="rows">${lives.others.map((o) => `<li><div class="r"><b>${D.esc(o.who)}</b><span class="end muted small num">${o.y || ""}</span><span class="muted small" style="grid-column:1/-1">${D.esc(o.note)}</span></div></li>`).join("")}</ul>` : "") +
      `<p class="small" style="margin:14px 0 0"><a href="/genealogy/">More song genealogies →</a></p></section>`;
  } else if (stage.length > 1) {
    h += `<section class="sheet"><h2>Life on stage</h2><ol class="lives">${stage.map(lifeRow).join("")}</ol>
      <p class="small muted" style="margin:8px 0 0">From the setlists. Comebacks are returns after four or more years away. <a href="/genealogy/">Song genealogies →</a></p></section>`;
  }

  h += `<section class="sheet"><h2>Live, year by year</h2>${D.bars(s.y, Math.min(...years), Math.max(thisYear, ...years), (y, n) => n && n === peak[1])}
    <p class="small muted" style="margin-top:8px">Performance counts from setlist.fm.</p></section>`;

  // Performances by year, newest first
  const byYear = {};
  for (const p of perf.p) (byYear[p[0].slice(0, 4)] = byYear[p[0].slice(0, 4)] || []).push(p);
  const ylist = Object.keys(byYear).sort().reverse();
  h += `<section class="sheet"><h2>Every performance <span class="muted small" style="font-family:var(--body);font-weight:400">${perf.p.length}</span></h2>` +
    ylist.map((y, i) => `<details class="yr-perf"${i === 0 ? " open" : ""}><summary>${y} <span class="muted">· ${byYear[y].length}</span></summary><ul>` +
      byYear[y].slice().reverse().map(([d, id, v, c, cc]) => `<li><a href="/concert/?id=${id}">${D.date(d)}</a> · ${D.esc(v)}, ${D.esc(c)} <span class="muted">${cc}</span></li>`).join("") + `</ul></details>`).join("") +
    `</section>`;
  M.innerHTML = h;
  try {
    const t = await D.get(`/api/spotify?q=${encodeURIComponent(s.n)}`);
    if (t.id) document.getElementById("listen").innerHTML = `<section class="sheet"><h2>Listen</h2>${D.player("track", t.id, t.album ? `${t.name} · ${t.album}` : t.name)}</section>`;
  } catch (e) {}
})();
</script>
</body>
</html>
