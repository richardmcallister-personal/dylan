<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shows · Dylan Notes</title>
<meta name="description" content="Every Bob Dylan show on record, year by year, with setlists, and the upcoming dates.">
<link rel="preload" href="/fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/d.css">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1814">
<script>try{var t=localStorage.getItem("dn_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/d.js"></script>
</head>
<body>
<main id="main">
  <div class="head">
    <h1>Shows</h1>
    <p id="lede">Every show on record, year by year, with setlists.</p>
  </div>
  <section class="sheet" id="next" hidden><h2>Coming up</h2><ul class="rows"></ul>
    <p class="small muted" style="margin-top:8px">Dates as listed on setlist.fm. Check <a href="https://www.bobdylan.com/tour/" rel="noopener">bobdylan.com</a> for tickets and changes.</p></section>
  <section class="sheet"><h2>Pick a year</h2><div class="years" id="years"></div>
    <p class="small muted" style="margin:10px 0 0">Not yet included: the 1974 tour with the Band and most of 1986–87. They will be added in a later update.</p></section>
  <section class="sheet" id="yearSheet"><div class="loading">Loading…</div></section>
</main>
<script>
D.shell("concerts");
(async () => {
  const idx = await D.get("/data/index.json");
  const ys = Object.keys(idx.years);
  document.getElementById("lede").textContent = `${idx.total} shows on record from ${ys[0]} to ${ys[ys.length - 1]}, in ${idx.countries} countries, ${idx.withSetlist} of them with a full setlist.`;
  const first = +ys[0], last = +ys[ys.length - 1];
  let year = D.qs("y") || String(last);
  const Y = document.getElementById("years");
  function years() {
    let h = "";
    for (let y = first; y <= last; y++) {
      const n = idx.years[y];
      h += n ? `<a href="?y=${y}" data-y="${y}" class="${String(y) === year ? "on" : ""}" title="${n} shows">${y}</a>` : `<a class="none" aria-hidden="true">${y}</a>`;
    }
    Y.innerHTML = h;
  }
  years();
  Y.addEventListener("click", (e) => {
    const a = e.target.closest("[data-y]"); if (!a) return;
    e.preventDefault(); year = a.dataset.y; history.replaceState(null, "", "?y=" + year); years(); draw();
  });

  const S = document.getElementById("yearSheet");
  async function draw() {
    S.innerHTML = `<div class="loading">Loading…</div>`;
    let shows = [];
    try { shows = await D.get(`/data/years/${year}.json`); } catch (e) {}
    shows = shows.slice().reverse();
    const n = (s) => s.sets.reduce((t, x) => t + x.s.length, 0);
    S.innerHTML = `<h2>${year} <span class="muted small" style="font-family:var(--body);font-weight:400">${shows.length} shows</span></h2><ul class="rows">` +
      shows.map((s) => `<li><a class="r" href="/concert/?id=${s.id}"><b>${D.esc(s.v)}</b><span class="muted small">${D.date(s.d, true)} · ${D.esc(D.place(s))}${s.t ? " · " + D.esc(s.t) : ""}</span><span class="end small muted num">${n(s) ? n(s) + " songs" : "no setlist"}</span></a></li>`).join("") + `</ul>`;
  }
  draw();

  // Upcoming, live
  try {
    const today = D.today();
    const up = (await D.get("/api/latest")).shows.filter((s) => s.d >= today && !s.sets.some((x) => x.s.length)).sort((a, b) => (a.d < b.d ? -1 : 1));
    if (up.length) {
      const N = document.getElementById("next"); N.hidden = false;
      N.querySelector(".rows").innerHTML = up.map((s) => `<li><div class="r"><b>${D.esc(s.v)}</b><span class="muted small">${D.esc(D.place(s))}</span><span class="end small num">${D.date(s.d, true)}</span></div></li>`).join("");
    }
  } catch (e) {}
})();
</script>
</body>
</html>
