<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gallery · Bob Dylan</title>
<meta name="description" content="Bob Dylan on stage and on the road, 1963 to 2023: 300 photographs in date order, filtered by decade, year and country.">
<link rel="preload" href="/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/d.css">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/assets/dylan-eye-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#b3261e">
<script>try{var t=localStorage.getItem("dn_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/d.js"></script>
</head>
<body>
<main id="main" class="wrap">
  <div class="head"><h1>Gallery</h1><p>Bob Dylan on stage and on the road, 1963 to 2023, in date order.</p></div>
  <div class="chips" id="decades" role="group" aria-label="Filter by decade"></div>
  <div class="tools">
    <select id="year" class="find gsel" aria-label="Year"><option value="">All years</option></select>
    <select id="country" class="find gsel" aria-label="Country"><option value="">All countries</option></select>
    <input type="search" class="find" id="q" placeholder="Venue or city" aria-label="Search by venue or city">
    <span class="sp"></span>
    <div class="chips" role="group" aria-label="Order">
      <button class="chip" type="button" data-o="asc" aria-pressed="true">Oldest first</button>
      <button class="chip" type="button" data-o="desc" aria-pressed="false">Newest first</button>
    </div>
  </div>
  <p class="muted small" id="count" role="status"></p>
  <div id="grid"><div class="loading">Loading…</div></div>
</main>
<dialog id="lb" class="lb" aria-label="Photo">
  <figure>
    <img id="lbimg" alt="">
    <figcaption><div><b id="lbplace"></b><small id="lbwhen"></small></div><span id="lblink"></span></figcaption>
  </figure>
  <button type="button" class="lbx" data-a="close" aria-label="Close">×</button>
  <button type="button" class="lbn prev" data-a="prev" aria-label="Previous photo">‹</button>
  <button type="button" class="lbn next" data-a="next" aria-label="Next photo">›</button>
</dialog>
<script>
D.shell("gallery");
(async () => {
  const all = await D.get("/data/gallery.json");
  const $ = (id) => document.getElementById(id);
  const G = $("grid"), DEC = $("decades"), Y = $("year"), C = $("country"), Q = $("q"), N = $("count");
  const P = new URLSearchParams(location.search);
  const st = { d: P.get("d") || "", y: P.get("y") || "", c: P.get("c") || "", q: P.get("q") || "", o: P.get("o") === "desc" ? "desc" : "asc" };
  const dec = (y) => Math.floor(y / 10) * 10;
  const decades = [...new Set(all.map((p) => dec(p.y)))];
  const countries = [...new Set(all.map((p) => p.country))].sort();
  const fold = (s) => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const when = (p) => (p.show ? D.date(p.show.d, true) : String(p.y));
  let shown = [];

  C.innerHTML += countries.map((c) => `<option>${D.esc(c)}</option>`).join("");
  Q.value = st.q;

  const years = () => [...new Set(all.filter((p) => !st.d || dec(p.y) === +st.d).map((p) => p.y))];
  const fillYears = () => {
    Y.innerHTML = `<option value="">All years</option>` + years().map((y) => `<option${String(y) === st.y ? " selected" : ""}>${y}</option>`).join("");
  };

  const save = () => {
    const u = new URLSearchParams();
    for (const k of ["d", "y", "c", "q"]) if (st[k]) u.set(k, st[k]);
    if (st.o === "desc") u.set("o", "desc");
    history.replaceState(null, "", location.pathname + (u.toString() ? "?" + u : ""));
  };

  const render = () => {
    const q = fold(st.q.trim());
    shown = all.filter((p) => (!st.d || dec(p.y) === +st.d) && (!st.y || p.y === +st.y) && (!st.c || p.country === st.c) && (!q || fold(p.place).includes(q)));
    if (st.o === "desc") shown.reverse();
    DEC.innerHTML = `<button class="chip" type="button" data-d="" aria-pressed="${!st.d}">All<span class="n">${all.length}</span></button>` +
      decades.map((d) => `<button class="chip" type="button" data-d="${d}" aria-pressed="${String(d) === st.d}">${d}s<span class="n">${all.filter((p) => dec(p.y) === d).length}</span></button>`).join("");
    C.value = st.c;
    N.textContent = shown.length === all.length ? `${all.length} photographs` : `${shown.length} of ${all.length} photographs`;
    if (!shown.length) { G.innerHTML = `<p class="empty">No photographs match. <a href="/gallery/">Show all</a>.</p>`; return; }
    const groups = [];
    shown.forEach((p, i) => {
      const g = groups[groups.length - 1];
      if (!g || g.y !== p.y) groups.push({ y: p.y, items: [[p, i]] });
      else g.items.push([p, i]);
    });
    G.innerHTML = groups.map((g) => `<section class="gyear"><h2 class="row"><span class="big num">${g.y}</span><a class="muted small" href="/concerts/?y=${g.y}">Shows in ${g.y}</a></h2>
      <ul class="gal">${g.items.map(([p, i]) => `<li><button type="button" data-i="${i}" aria-label="Open photo: ${D.esc(p.place)}, ${when(p)}">
        <img src="/assets/dylan-concert-photos/thumbs/${String(p.n).padStart(3, "0")}.webp" alt="Bob Dylan, ${D.esc(p.place)}, ${p.y}" width="360" height="360" loading="lazy" decoding="async">
        <span><b>${D.esc(p.venue || p.city || p.country)}</b><small>${D.esc(p.venue ? p.city || p.country : p.country)} · ${p.show ? D.date(p.show.d) : p.y}</small></span></button></li>`).join("")}</ul></section>`).join("");
  };

  // Lightbox
  const L = $("lb"), IMG = $("lbimg");
  let cur = -1;
  const open = (i) => {
    cur = (i + shown.length) % shown.length;
    const p = shown[cur];
    IMG.src = `/assets/dylan-concert-photos/photos/${p.f}`;
    IMG.width = p.w; IMG.height = p.h;
    IMG.alt = `Bob Dylan, ${p.place}, ${p.y}`;
    $("lbplace").textContent = p.place;
    $("lbwhen").textContent = `${when(p)} · ${cur + 1} of ${shown.length}`;
    $("lblink").innerHTML = p.show ? `<a class="btn" href="/concert/?id=${p.show.id}">Setlist</a>` : `<a class="btn" href="/concerts/?y=${p.y}">${p.y} shows</a>`;
    if (!L.open) L.showModal();
    const nx = shown[(cur + 1) % shown.length];
    new Image().src = `/assets/dylan-concert-photos/photos/${nx.f}`;
  };
  G.addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) open(+b.dataset.i); });
  L.addEventListener("click", (e) => {
    const a = e.target.closest("[data-a]");
    if (a) { a.dataset.a === "close" ? L.close() : open(cur + (a.dataset.a === "next" ? 1 : -1)); return; }
    if (e.target === L) L.close();
  });
  document.addEventListener("keydown", (e) => {
    if (!L.open) return;
    if (e.key === "ArrowRight") open(cur + 1);
    if (e.key === "ArrowLeft") open(cur - 1);
  });
  let tx = null;
  L.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
  L.addEventListener("touchend", (e) => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) open(cur + (dx < 0 ? 1 : -1));
  });
  L.addEventListener("close", () => { IMG.removeAttribute("src"); });

  // Filters
  DEC.addEventListener("click", (e) => { const b = e.target.closest("[data-d]"); if (!b) return; st.d = b.dataset.d; st.y = ""; fillYears(); render(); save(); });
  Y.addEventListener("change", () => { st.y = Y.value; render(); save(); });
  C.addEventListener("change", () => { st.c = C.value; render(); save(); });
  let t;
  Q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { st.q = Q.value; render(); save(); }, 150); });
  document.querySelectorAll("[data-o]").forEach((b) => b.addEventListener("click", () => {
    st.o = b.dataset.o;
    document.querySelectorAll("[data-o]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    render(); save();
  }));
  document.querySelectorAll("[data-o]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.o === st.o));

  fillYears();
  render();
})();
</script>
</body>
</html>
