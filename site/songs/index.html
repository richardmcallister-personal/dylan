<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Songs · Dylan Notes</title>
<meta name="description" content="Every song Bob Dylan has played live: how often, first and last time, his own songs and covers.">
<link rel="preload" href="/fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/d.css">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1814">
<script>try{var t=localStorage.getItem("dn_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/d.js"></script>
</head>
<body>
<main id="main">
  <div class="head">
    <h1>Songs played live</h1>
    <p id="lede">Every song in the setlists on record, with how often it has been played and when.</p>
  </div>
  <div class="tools">
    <input type="search" id="q" placeholder="Find a song" aria-label="Find a song" autocomplete="off">
    <div class="chips" id="kind" role="group" aria-label="Show">
      <button class="chip" type="button" data-k="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-k="own" aria-pressed="false">His songs</button>
      <button class="chip" type="button" data-k="cover" aria-pressed="false">Covers</button>
    </div>
    <span class="sp"></span>
    <div class="chips" id="sort" role="group" aria-label="Sort">
      <button class="chip" type="button" data-o="plays" aria-pressed="true">Most played</button>
      <button class="chip" type="button" data-o="az" aria-pressed="false">A–Z</button>
      <button class="chip" type="button" data-o="recent" aria-pressed="false">Played lately</button>
    </div>
  </div>
  <section class="sheet"><ul class="rows" id="list"><li class="loading">Loading…</li></ul><div id="moreWrap"></div></section>
</main>
<script>
D.shell("songs");
(async () => {
  const songs = await D.get("/data/songs.json");
  const own = songs.filter((s) => !s.c).length;
  document.getElementById("lede").textContent = `${songs.length} songs in the setlists on record: ${own} of his own and ${songs.length - own} by others. Tap one for every performance.`;
  let kind = "all", order = "plays", q = "", limit = 100;
  const L = document.getElementById("list"), M = document.getElementById("moreWrap");
  function draw() {
    const norm = (s) => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
    let list = songs.filter((s) => (kind === "all" || (kind === "own" ? !s.c : !!s.c)) && (!q || norm(s.n).includes(norm(q))));
    if (order === "az") list = list.slice().sort((a, b) => a.n.localeCompare(b.n));
    if (order === "recent") list = list.slice().sort((a, b) => (a.l[0] < b.l[0] ? 1 : a.l[0] > b.l[0] ? -1 : b.k - a.k));
    L.innerHTML = list.slice(0, limit).map((s) =>
      `<li><a class="r" href="/song/?s=${s.s}"><b>${D.esc(s.n)}</b><span class="muted small">${s.c ? "Cover of " + D.esc(s.c) + " · " : ""}${s.f[0].slice(0, 4)}${s.l[0].slice(0, 4) !== s.f[0].slice(0, 4) ? "–" + s.l[0].slice(0, 4) : ""}${order === "recent" ? " · last " + D.date(s.l[0]) : ""}</span><span class="end num big">${s.k}</span></a></li>`).join("") ||
      `<li class="empty" style="padding:10px 0">No song matches “${D.esc(q)}”.</li>`;
    M.innerHTML = list.length > limit ? `<button class="chip" type="button" id="more" style="margin-top:12px">Show all ${list.length}</button>` : "";
    if (list.length > limit) document.getElementById("more").onclick = () => { limit = 1e9; draw(); };
  }
  document.getElementById("q").addEventListener("input", (e) => { q = e.target.value.trim(); limit = 100; draw(); });
  for (const [id, attr, set] of [["kind", "k", (v) => (kind = v)], ["sort", "o", (v) => (order = v)]]) {
    const g = document.getElementById(id);
    g.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      set(b.dataset[attr]);
      g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      limit = 100; draw();
    });
  }
  draw();
})();
</script>
</body>
</html>
